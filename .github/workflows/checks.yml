name: CatalogDB checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: catalogdb
          POSTGRES_PASSWORD: catalogdb-test-only
          POSTGRES_DB: catalogdb_test
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U catalogdb -d catalogdb_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CATALOGDB_TEST_DATABASE_URL: postgres://catalogdb:catalogdb-test-only@127.0.0.1:55432/catalogdb_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s packaging -p test_publish_releases.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: go test ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - run: wails build -clean -platform windows/amd64
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installers and check upgrade from 0.8.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force packaging/vendor | Out-Null
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile packaging/vendor/MicrosoftEdgeWebView2Setup.exe
          $signature = Get-AuthenticodeSignature packaging/vendor/MicrosoftEdgeWebView2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Invalid WebView2 installer signature' }
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName
          if (!$iscc) { throw 'Inno Setup not found' }
          Expand-Archive downloads/CatalogDB-windows-x64-0.8.1.zip -DestinationPath build/legacy
          $legacy = (Get-ChildItem build/legacy -Filter CatalogDB.exe -Recurse | Select-Object -First 1).FullName
          if (!$legacy) { throw 'Previous release EXE missing' }
          & $iscc '/DAppVersion=0.8.1' "/DAppExe=$legacy" packaging/inno_setup/catalogdb.iss
          if ($LASTEXITCODE -ne 0) { throw 'Old installer failed' }
          & $iscc packaging/inno_setup/catalogdb.iss
          if ($LASTEXITCODE -ne 0) { throw 'New installer failed' }
          ./packaging/windows-smoke.ps1 -OldInstaller build/bin/CatalogDB_Setup_0.8.1.exe -NewInstaller build/bin/CatalogDB_Setup_0.13.0.exe -ExpectedExe build/bin/CatalogDB.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CatalogDB-windows-smoke-report
          path: build/windows-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: CatalogDB-windows-x64
          path: |
            build/bin/CatalogDB.exe
            build/bin/CatalogDB_Setup_0.13.0.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth dbus-x11 xdotool
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - run: bash packaging/build-linux.sh
      - name: Check desktop launch
        run: dbus-run-session -- xvfb-run -a bash packaging/linux-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CatalogDB-linux-x64
          path: |
            build/bin/CatalogDB-linux-x64-*.tar.gz*
            build/linux-launch.log

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: catalogdb
          POSTGRES_PASSWORD: catalogdb-test-only
          POSTGRES_DB: catalogdb_test
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U catalogdb -d catalogdb_test" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android tools
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/catalogdb-android-tools.log"
          trap 'status=$?; if (( status != 0 )); then echo "::error title=Android tool installation::$(tail -c 4000 "$log" | tr "\r\n" "  ")"; fi' EXIT
          exec > >(tee "$log") 2>&1
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          gomobile init
          # init installs gobind@latest; restore the version pinned by this app.
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Build APK with disposable CI signing key
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/catalogdb-android-build.log"
          trap 'status=$?; if (( status != 0 )); then echo "::error title=Android package build::$(tail -c 4000 "$log" | tr "\r\n" "  ")"; fi' EXIT
          exec > >(tee "$log") 2>&1
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/catalogdb-signing.XXXXXX")
          trap 'status=$?; rm -rf "$signing_dir"; if (( status != 0 )); then echo "::error title=Android package build::$(tail -c 4000 "$log" | tr "\r\n" "  ")"; fi' EXIT
          openssl rand -hex 32 > "$signing_dir/password"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$signing_dir/test-only.p12" -alias catalogdb-ci \
            -storepass:file "$signing_dir/password" -keypass:file "$signing_dir/password" \
            -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=CatalogDB CI test only'
          export CATALOGDB_ANDROID_KEYSTORE="$signing_dir/test-only.p12"
          export CATALOGDB_ANDROID_KEY_ALIAS=catalogdb-ci
          export CATALOGDB_ANDROID_STORE_PASS_FILE="$signing_dir/password"
          export CATALOGDB_ANDROID_KEY_PASS_FILE="$signing_dir/password"
          bash packaging/build-android.sh
          CATALOGDB_ANDROID_SMOKE_PREPARE_ONLY=1 bash packaging/android-native-smoke.sh android_smoke_ci create
      - name: Enable KVM for native Android verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real WebView, Go, PostgreSQL and Keystore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 7
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            adb install --no-incremental -r build/bin/CatalogDB-android-*.apk
            adb install --no-incremental -r build/android/catalogdb-native-smoke.apk
            adb shell am instrument -w -e schema android_smoke_ci -e phase create ru.dbcatalog.smoke/ru.dbcatalog.smoke.NativeSmoke > build/android/native-create.log
            cat build/android/native-create.log
            if ! grep -q '^PASS: Android' build/android/native-create.log; then echo '::error title=Android native create::'"$(tail -c 1000 build/android/native-create.log | tr '\n' ' ')"; exit 1; fi
            adb shell am force-stop ru.dbcatalog.app
            adb shell am instrument -w -e schema android_smoke_ci -e phase resume ru.dbcatalog.smoke/ru.dbcatalog.smoke.NativeSmoke > build/android/native-resume.log
            cat build/android/native-resume.log
            if ! grep -q '^PASS: Android' build/android/native-resume.log; then echo '::error title=Android native resume::'"$(tail -c 1000 build/android/native-resume.log | tr '\n' ' ')"; exit 1; fi
            adb shell am force-stop ru.dbcatalog.app
            adb shell am start -n ru.dbcatalog.app/.MainActivity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CatalogDB-android-native-report
          path: build/android/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: CatalogDB-android-CI-test-only-not-release
          path: |
            build/bin/CatalogDB-android-*.apk
            build/bin/CatalogDB-android-*.apk.sha256
