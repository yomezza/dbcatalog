name: CatalogDB checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: catalogdb
          POSTGRES_PASSWORD: catalogdb-test-only
          POSTGRES_DB: catalogdb_test
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U catalogdb -d catalogdb_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CATALOGDB_TEST_DATABASE_URL: postgres://catalogdb:catalogdb-test-only@127.0.0.1:55432/catalogdb_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: go test -race ./...
      - run: go vet ./...
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: go test ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - run: wails build -clean -platform windows/amd64
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installers and check upgrade from 0.6.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force packaging/vendor | Out-Null
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile packaging/vendor/MicrosoftEdgeWebView2Setup.exe
          $signature = Get-AuthenticodeSignature packaging/vendor/MicrosoftEdgeWebView2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Invalid WebView2 installer signature' }
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName
          if (!$iscc) { throw 'Inno Setup not found' }
          Expand-Archive downloads/CatalogDB-windows-x64-0.6.0.zip -DestinationPath build/legacy
          $legacy = (Get-ChildItem build/legacy -Filter CatalogDB.exe -Recurse | Select-Object -First 1).FullName
          if (!$legacy) { throw 'Previous release EXE missing' }
          & $iscc '/DAppVersion=0.6.0' "/DAppExe=$legacy" packaging/inno_setup/catalogdb.iss
          if ($LASTEXITCODE -ne 0) { throw 'Old installer failed' }
          & $iscc packaging/inno_setup/catalogdb.iss
          if ($LASTEXITCODE -ne 0) { throw 'New installer failed' }
          ./packaging/windows-smoke.ps1 -OldInstaller build/bin/CatalogDB_Setup_0.6.0.exe -NewInstaller build/bin/CatalogDB_Setup_0.7.0.exe -ExpectedExe build/bin/CatalogDB.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CatalogDB-windows-smoke-report
          path: build/windows-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: CatalogDB-windows-x64
          path: |
            build/bin/CatalogDB.exe
            build/bin/CatalogDB_Setup_0.7.0.exe
